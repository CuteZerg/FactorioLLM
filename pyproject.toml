[project]
name = "factoriollm"
version = "0.1.0"
description = "LLM based text to blueprint project for Factorio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "factorio-draftsman>=3.3.1",
    "google-genai>=2.20.0",
    "httpx[socks]>=0.28.1",
    "python-dotenv>=1.2.3",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
]

[project.scripts]
factoriollm = "factoriollm:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
